# The initramfs shipped in the base image is built generic (non-hostonly)
# and already contains resume-from-hibernation support. This drop-in only
# matters if client-side initramfs regeneration is ever enabled
# (`rpm-ostree initramfs --enable`): a regenerated image must keep the
# resume module too, or the machine would boot fresh past its hibernation
# image and silently lose the saved session.
add_dracutmodules+=" resume "
