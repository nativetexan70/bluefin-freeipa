# i915 (Intel integrated graphics) power-saving module options.
#
# Targets 12th-gen "Alder Lake" Intel laptop hardware (this image's primary
# platform — see CLAUDE.md), whose Xe-LP integrated GPU benefits from two
# options that are not unconditionally on by default across kernel/firmware
# combinations:
#
#   enable_guc=3
#     Bit 0 hands command submission/scheduling off to the GPU's own GuC
#     firmware micro-controller instead of the host CPU; bit 1 loads HuC
#     firmware, which the GPU's fixed-function media engine needs to do
#     hardware video encode/decode (see intel-media-driver below — without
#     HuC loaded, some encode paths silently fall back to software, which
#     costs far more power on a laptop than the hardware path). i915's own
#     in-kernel default for enable_guc is -1 ("use each platform's
#     recommended value"), which already resolves to 3 on most currently
#     shipped Alder Lake kernels — this pins that value explicitly rather
#     than relying on a per-kernel-version default silently changing under
#     later Bluefin base image updates, the same reasoning already applied
#     to dsp_driver in the Chromebook SOF audio section of build.sh.
#
#   enable_fbc=1
#     Framebuffer Compression: the GPU keeps a compressed copy of the
#     front buffer and only re-reads/re-transmits changed regions, cutting
#     display-memory bandwidth (and the power that bandwidth costs) whenever
#     most of the screen is static — the common case on a laptop running on
#     battery. Well-established and low-risk on Gen9+ hardware (which
#     includes Alder Lake's Xe-LP); i915's own default is platform-dependent
#     and not reliably on for every SKU, so this pins it on explicitly.
#
# Deliberately not set here: i915.enable_psr (Panel Self Refresh). PSR/PSR2
# saves meaningfully more power than FBC alone on an eDP laptop panel, but
# has a long history of panel-specific corruption/flicker bugs that depend
# on the exact panel and firmware fitted to a given Lenovo SKU — unlike
# GuC/HuC and FBC, it isn't safe to force on generically across "whatever
# 12th-gen Lenovo laptop this image happens to be running on" without
# per-machine verification. Leave it at the kernel's own per-platform
# default; enable it manually (i915.enable_psr=1 on the kernel command line)
# on a specific machine only after confirming the panel doesn't corrupt.
options i915 enable_guc=3 enable_fbc=1
