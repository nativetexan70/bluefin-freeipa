# Seed Orbit's payload from the image into the mutable, /var-backed /opt
# and /usr/local trees on first boot.
#
# See build.sh for why this is needed: bootc/ostree never carry file
# content under /var from the container image onto a deployed system, so
# the fleetd RPM's /opt/orbit and /usr/local/bin/orbit content has to be
# shipped under /usr instead (which IS carried over) and copied into
# place here.
#
# `C` only copies when the destination path doesn't already exist, so
# this fires once per host on first boot and leaves alone whatever state
# Orbit itself later writes into /opt/orbit (osqueryd DB, TUF-downloaded
# updates, etc.) on every subsequent boot.
C /opt/orbit - - - - /usr/lib/orbit-seed/opt/orbit
C /usr/local/bin/orbit - - - - /usr/lib/orbit-seed/usr-local-bin/orbit
