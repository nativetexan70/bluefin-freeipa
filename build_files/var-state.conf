#Type Path                            Mode UID  GID  Age Argument
#
# sssd runtime/cache directories. Declared here instead of created directly
# in build.sh with `install -d`, so nothing needs to be baked into /var at
# build time at all — systemd-tmpfiles-setup.service creates these fresh on
# first real boot, before sssd starts (that ordering is the whole point of
# tmpfiles.d), and bootc container lint's var-tmpfiles check only flags /var
# content that lacks exactly this kind of declaration.
d /var/lib/sss/db             0711 root root -
d /var/lib/sss/pipes/private  0755 root root -
d /var/log/sssd               0755 root root -

# /var/lib/sss/keytabs is sssd-owned (mode/ownership match what the sssd
# package itself creates), not root — it holds per-domain keytabs sssd
# manages for services like NFS/CIFS that need their own machine
# credentials, separate from /etc/krb5.keytab.
d /var/lib/sss/keytabs        0770 sssd sssd -

# certmonger's and freeipa-client's own state directories. Unlike the sssd
# ones above, none of these four are created by build.sh — they come
# straight from the certmonger and freeipa-client RPMs' own package
# payloads, so they're baked into the image regardless of anything this
# file does. Declaring them here doesn't remove that build-time content; it
# documents that it's expected/owned, and gives bootc container lint's
# var-tmpfiles check something to match, the same way each package's own
# upstream tmpfiles.d would if their Fedora package builds shipped one
# (they don't; these are all still plain %install `mkdir -p`, not
# tmpfiles.d, in the current specs).
d /var/lib/certmonger             0755 root root -
d /var/lib/certmonger/cas         0700 root root -
d /var/lib/certmonger/local       0700 root root -
d /var/lib/certmonger/requests    0700 root root -
d /var/lib/ipa-client             0755 root root -
d /var/lib/ipa-client/pki         0755 root root -
d /var/lib/ipa-client/sysrestore  0755 root root -
