# The initramfs shipped in the base image is built generic (non-hostonly),
# which normally pulls in a broad set of storage drivers automatically.
# However, dracut's generic driver inclusion is host-agnostic only for
# modules matching known PCI/USB storage classes; eMMC/SD host controllers
# (mmc_core/mmc_block plus the sdhci bus drivers) are not always picked up
# the same way, so hardware that boots from mmcblk* devices (many NUC-class
# mini PCs, tablets, and embedded boards) can fail to find its root
# filesystem at boot.
#
# Force these drivers into the initramfs so GRUB can hand off to a kernel
# that is guaranteed to find and mount an mmcblk* root/boot partition,
# regardless of which specific eMMC/SD host controller the hardware uses.
# This mirrors 95-hibernation-resume.conf: it matters both for the image's
# shipped initramfs and for any initramfs regenerated locally afterward
# (`rpm-ostree initramfs --enable`).
add_drivers+=" mmc_core mmc_block sdhci sdhci_pci sdhci_acpi "
