#Type Name      ID   GECOS       Home            Shell
#
# linuxbrew's ID is a bare UID (not "uid:gid"): that form auto-creates a
# matching private group (name "linuxbrew", GID 950 too), the same
# default a plain `useradd` would give it. The "uid:gid" form instead
# requires the GID's group to already exist beforehand, which 950 doesn't
# (it's brand new here) — using it unconditionally failed the build with
# "Failed to create linuxbrew: please create GID 950".
u     linuxbrew 950  "Homebrew"  /home/linuxbrew /bin/bash
g     brew      951
m     linuxbrew brew
